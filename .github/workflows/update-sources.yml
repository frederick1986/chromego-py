name: 更新订阅地址 sources.txt

on:
  workflow_dispatch:
    inputs:
      run_description:
        description: '运行说明（可选）'
        required: false
        default: '手动更新四个 sources.txt 文件'
        type: string

jobs:
  update-sources:
    runs-on: ubuntu-latest
    permissions:
     contents: write
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装输出生成依赖
        run: python -m pip install -r requirements.txt

      - name: 更新订阅地址并生成 outputs 文件
        run: |
          python update_sources.py
          python merge_sources.py
          python main.py

      - name: 验证生成的客户端订阅
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import yaml
          output = Path('outputs')
          proxies = yaml.safe_load((output / 'clash_meta.yaml').read_text(encoding='utf-8'))['proxies']
          raw = (output / 'sub_raw.txt').read_text(encoding='utf-8')
          encoded = (output / 'sub_base64.txt').read_text(encoding='utf-8')
          assert proxies, '未提取到节点，停止提交'
          assert raw.strip(), '未生成有效客户端 URI，停止提交'
          assert base64.b64decode(encoded).decode('utf-8') == raw, 'Base64 与明文订阅不一致'
          print(f'已验证 {len(proxies)} 个节点、{len(raw.splitlines())} 条客户端 URI')
          PY

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 拉取最新代码并 rebase
        run: |
          git pull --rebase --autostash origin main

      - name: 提交并推送订阅地址和 outputs 文件
        run: |
          git add urls/EdgeGo_sources.txt urls/ChromeGo_sources.txt urls/FirefoxFQ_sources.txt urls/sources.txt outputs/
          
          if git diff --cached --quiet; then
            echo "✅ 订阅地址和 outputs 均无变化，无需提交"
          else
            git commit -m "chore: 更新订阅地址和 outputs 文件 (手动触发)"
            git push origin main
            echo "✅ 已提交并推送订阅地址和 outputs 文件"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 执行结果
        run: echo "🎉 Workflow 执行完成！"
